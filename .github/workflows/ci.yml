name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. new commits pushed to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # PostGIS (not stock postgres) because the migration chain runs `CREATE EXTENSION
    # postgis` and the schema's GENERATED geography columns need the extension's
    # functions at apply time.
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark
          POSTGRES_DB: spark
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spark"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Installs this app and every vendor/* workspace member in one pass.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client is not generated by any build script, and pnpm may skip
      # postinstall scripts, so typecheck/test would fail on a clean runner
      # without this explicit step.
      - name: Generate Prisma client
        run: pnpm run db:generate

      # `spark` (POSTGRES_DB above) is used only to open a connection to issue these
      # CREATEs; the migrate-deploy and shadow databases below must each start empty.
      - name: Create scratch Postgres databases
        env:
          PGPASSWORD: spark
        run: |
          psql -h localhost -U spark -d spark -c "CREATE DATABASE spark_migrate_deploy;"
          psql -h localhost -U spark -d spark -c "CREATE DATABASE spark_migrate_shadow;"

      # Proves the full migration chain still applies cleanly to an empty database,
      # exactly like a fresh environment would run it.
      - name: Prisma migrate deploy (fresh database)
        env:
          DATABASE_URL: postgresql://spark:spark@localhost:5432/spark_migrate_deploy
        run: pnpm exec prisma migrate deploy

      # `prisma migrate dev` sees the same divergence as this diff and would generate a
      # "corrective" migration that DROPS the PostGIS geog columns, the Facility name
      # trigram index and TariffPlan.vehicleTypes' array default — none of which Prisma's
      # schema language can express, so they are permanent, not bugs. See
      # .github/scripts/check-prisma-drift.sh for why this greps the SQL instead of
      # relying on `--exit-code` alone.
      - name: Prisma schema drift check
        env:
          SHADOW_DATABASE_URL: postgresql://spark:spark@localhost:5432/spark_migrate_shadow
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > /tmp/prisma-drift.sql
          bash .github/scripts/check-prisma-drift.sh /tmp/prisma-drift.sql

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Typechecks every vendor/* package before this app, via pnpm -r.
      - name: Typecheck
        run: pnpm run typecheck

      # Also runs the vendored packages' own suites (auth, maps, payments,
      # subscription-billing) via pnpm -r.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Proves the image that actually ships still builds from this repo alone.
      - name: Docker build
        run: docker build -t spark-api:ci .
